name: Generate Device Tree
on:
  workflow_dispatch:
    inputs:
      img_url:
        description: 'Direct download URL to your boot.img or recovery.img'
        required: true

jobs:
  twrpdtgen:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies and twrpdtgen
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip cpio git lz4 xz-utils
          pip3 install twrpdtgen

      - name: Download Image and Generate Tree
        run: |
          wget -O input.img "${{ github.event.inputs.img_url }}"
          python3 -m twrpdtgen input.img -o output_tree

      - name: Upload Generated Device Tree
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Device-Tree
          path: output_tree/
          
